<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Own Editor</title>
<style>
    * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #f5f5f5;
    font-family: Arial, Helvetica, sans-serif;
    color: #222;
}

.page-shell {
    width: min(1000px, 92vw);
    background: #fff;
    border: 1px solid #ddd;
    padding: 20px;
}

.topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 15px;
    margin-bottom: 10px;
}

.brand {
    display: flex;
    align-items: center;
    gap: 12px;
}

.brand-mark {
    width: 42px;
    height: 42px;
    display: grid;
    place-items: center;
    border: 1px solid #bbb;
    background: #f1f1f1;
    font-size: 1.4rem;
}

.eyebrow {
    font-size: 0.7rem;
    letter-spacing: 0.1rem;
    color: #666;
    margin-bottom: 4px;
}

#heading {
    font-size: 2rem;
    font-weight: 700;
    color: #111;
    font-family: Georgia, 'Times New Roman', serif;
}

.tagline {
    font-size: 0.95rem;
    margin-bottom: 18px;
    color: #555;
}

.workspace {
    display: grid;
    grid-template-columns: 1.5fr 0.9fr;
    gap: 20px;
    align-items: start;
}

.canvas-panel {
    background: #fafafa;
    border: 1px solid #ddd;
    padding: 12px;
}

#box {
    min-height: 350px;
    width: 100%;
    border: 1px solid #bbb;
    background: #fff;
    padding: 18px;
    font-size: 1rem;
    line-height: 1.6;
    outline: none;
}

.controls {
    display: flex;
    flex-direction: column;
    gap: 14px;
}

.control-group {
    border: 1px solid #ddd;
    background: #fafafa;
    padding: 12px;
}

.control-group h2 {
    font-size: 0.82rem;
    margin-bottom: 10px;
    color: #333;
    text-transform: uppercase;
    letter-spacing: 0.08rem;
}

.swatches {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
}

.swatch {
    width: 32px;
    height: 32px;
    border: 1px solid #999;
    cursor: pointer;
}

.bg-swatch.coral { background: #fca5a5; }
.bg-swatch.mint { background: #86efac; }
.bg-swatch.sky { background: #7dd3fc; }
.bg-swatch.lilac { background: #c4b5fd; }

.text-swatch.red { background: #d62828; }
.text-swatch.green { background: #1f9d68; }
.text-swatch.blue { background: #1d4ed8; }
.text-swatch.black { background: #111; }

.font-options {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 8px;
}

.font-btn {
    border: 1px solid #ccc;
    background: #fff;
    padding: 8px 6px;
    cursor: pointer;
    font-size: 0.8rem;
}

.font-btn.active {
    background: #f2f2f2;
    border-color: #999;
}

#download-button {
    background: #333;
    color: #fff;
    border: none;
    padding: 10px 18px;
    cursor: pointer;
    font-weight: 600;
}

#download-button:hover {
    background: #111;
}

@media (max-width: 760px) {
    .topbar {
        flex-direction: column;
        align-items: flex-start;
    }

    .workspace {
        grid-template-columns: 1fr;
    }
}


</style>
</head>
<body>
    <div class="page-shell">
        <header class="topbar">
            <div class="brand">
                <span class="brand-mark">✎</span>
                <div>
                    <p class="eyebrow">TEXT STUDIO</p>
                    <h1 id="heading">Your Own Editor</h1>
                </div>
            </div>
        </header>

        <p class="tagline">Write. Style. Export.</p>

        <main class="workspace">
            <section class="canvas-panel">
                <div id="box" contenteditable="true" aria-label="Text editor">
                    Type your text here...
                </div>
            </section>

            <aside class="controls">
                <div class="control-group">
                    <h2>Background</h2>
                    <div class="swatches">
                        <button class="swatch bg-swatch coral" data-bg="#ff8a80" type="button" aria-label="Coral background"></button>
                        <button class="swatch bg-swatch mint" data-bg="#9ae6b4" type="button" aria-label="Mint background"></button>
                        <button class="swatch bg-swatch sky" data-bg="#7dd3fc" type="button" aria-label="Sky background"></button>
                        <button class="swatch bg-swatch lilac" data-bg="#d8b4fe" type="button" aria-label="Lilac background"></button>
                    </div>
                </div>

                <div class="control-group">
                    <h2>Text color</h2>
                    <div class="swatches">
                        <button class="swatch text-swatch red" data-color="#e63946" type="button" aria-label="Red text"></button>
                        <button class="swatch text-swatch green" data-color="#2a9d8f" type="button" aria-label="Green text"></button>
                        <button class="swatch text-swatch blue" data-color="#1d4ed8" type="button" aria-label="Blue text"></button>
                        <button class="swatch text-swatch black" data-color="#111827" type="button" aria-label="Black text"></button>
                    </div>
                </div>

                <div class="control-group">
                    <h2>Font style</h2>
                    <div class="font-options">
                        <button class="font-btn active" type="button" data-font="Georgia, serif">Classic</button>
                        <button class="font-btn" type="button" data-font="'Trebuchet MS', sans-serif">Modern</button>
                        <button class="font-btn" type="button" data-font="'Courier New', monospace">Mono</button>
                        <button class="font-btn" type="button" data-font="'Segoe Print', 'Bradley Hand', cursive">Script</button>
                    </div>
                </div>
            </aside>
        </main>
    </div>

    <script>
        const box = document.getElementById("box");

        document.querySelectorAll(".bg-swatch").forEach((button) => {
            button.addEventListener("click", () => {
                box.style.backgroundColor = button.dataset.bg;
            });
        });

        document.querySelectorAll(".text-swatch").forEach((button) => {
            button.addEventListener("click", () => {
                box.style.color = button.dataset.color;
            });
        });

        document.querySelectorAll(".font-btn").forEach((button) => {
            button.addEventListener("click", () => {
                box.style.fontFamily = button.dataset.font;
                document.querySelectorAll(".font-btn").forEach((btn) => btn.classList.remove("active"));
                button.classList.add("active");
            });
        });
    </script>
</body>
</html>
